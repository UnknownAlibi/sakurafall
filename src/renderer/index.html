<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: sakurafall-cache: https: http:; media-src 'self' data: blob: sakurafall-media: https: http:; connect-src 'self' sakurafall-media: https: http: ws: wss: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
  <title>SAKURAFALL</title>
  <link rel="icon" type="image/png" href="/sakurafall-mark-v4.png" />
  <style>
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #171120;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f7eef4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      z-index: 9999;
    }
    
    .loading-mark-wrap {
      width: 128px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      filter: drop-shadow(0 14px 22px rgba(246, 93, 135, 0.2));
    }

    .loading-mark {
      position: relative;
      display: block;
      width: 128px;
      height: 180px;
      overflow: hidden;
    }

    .loading-mark::before {
      content: '';
      position: absolute;
      inset: 0 auto 0 0;
      width: 3200%;
      background: url('./assets/generated/yingyue-loading-animation.webp') left top / 100% 100% no-repeat;
      animation: boot-yingyue 1s steps(32) infinite;
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    @keyframes boot-yingyue { to { transform: translate3d(-100%, 0, 0); } }
    
    .loading-text {
      font-size: 18px;
      font-weight: 500;
    }
    
    .loading-subtitle {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 8px;
      color: #75d9cc;
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-mark::before {
        width: 100%;
        background-image: url('./assets/generated/yingyue-loading-static.webp');
        animation: none;
      }
    }
    
    /* 隐藏加载动画 */
    .loaded #loading {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <!-- 应用根节点 -->
  <div id="app"></div>
  
  <!-- 加载动画 -->
  <div id="loading">
    <div class="loading-mark-wrap">
      <span class="loading-mark" aria-hidden="true"></span>
    </div>
    <div class="loading-text">SAKURAFALL</div>
    <div class="loading-subtitle">樱月正在准备放映...</div>
  </div>

  <!-- Vite 入口文件 -->
  <script type="module" src="/main.js"></script>
</body>
</html>
